name: Verify Mideli

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://ci.example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  database:
    name: Supabase migrations and pgTAP
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      - name: Inspect Docker runtime
        run: |
          docker version
          docker info

      - name: Start PostgreSQL only
        run: |
          set +e
          supabase db start --debug > supabase-db-start.log 2>&1
          exit_code=$?
          diagnostic=$(tail -c 5000 supabase-db-start.log | tr '\n' ' ' | tr '\r' ' ')
          echo "::error title=Supabase DB start (exit ${exit_code})::${diagnostic}"
          cat supabase-db-start.log
          exit "${exit_code}"

      - name: Apply migrations without seed data
        run: supabase db reset --local --no-seed

      - name: Run database tests
        run: |
          set +e
          supabase test db --local > supabase-db-test.log 2>&1
          exit_code=$?
          diagnostic=$(tail -c 5000 supabase-db-test.log | tr '\n' ' ' | tr '\r' ' ')
          echo "::error title=Supabase database tests (exit ${exit_code})::${diagnostic}"
          cat supabase-db-test.log
          exit "${exit_code}"

      - name: Stop Supabase
        if: always()
        run: supabase stop
